# Builds the addon zip and uploads it to CurseForge and GitHub Releases
# whenever a version tag (e.g. v1.2.0) is pushed.
#
# Required repository secret: CF_API_KEY (CurseForge API token).
# The CurseForge project ID is read from "## X-Curse-Project-ID" in the TOC.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: BigWigsMods/packager@v2
